# Puerta de enlace: imita las rutas de Supabase y habilita CORS para el frontend en desarrollo.
server {
  listen 80;
  add_header Access-Control-Allow-Origin * always;
  add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, prefer, accept-profile, content-profile, range" always;
  add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
  add_header Access-Control-Expose-Headers "content-range" always;

  if ($request_method = OPTIONS) { return 204; }

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
  }
  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
  }
}
